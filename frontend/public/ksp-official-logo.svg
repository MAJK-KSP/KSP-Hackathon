<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    
    <!-- Gold Gradients for Lions & Scroll -->
    <linearGradient id="goldMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Red Gradient for Shield & Manes -->
    <linearGradient id="kspRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- Deep Blue for Shield Border -->
    <linearGradient id="kspNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Green for Base Scroll -->
    <linearGradient id="kspGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <!-- Group Wrapper with Shadow -->
  <g filter="url(#shadow)">

    <!-- ==================== 1. ASHOKA LION CAPITAL (TOP) ==================== -->
    <g id="ashoka-capital" transform="translate(250, 65)">
      <!-- Lion Capital Base Pedestal -->
      <ellipse cx="0" cy="55" rx="22" ry="5" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1.5"/>
      <rect x="-24" y="55" width="48" height="6" fill="#93C5FD" stroke="#1E3A8A" stroke-width="1.5" rx="2"/>
      
      <!-- Dharma Chakra in Center of Abacus -->
      <circle cx="0" cy="58" r="4.5" fill="#1E3A8A"/>
      <circle cx="0" cy="58" r="1.5" fill="#FFFFFF"/>

      <!-- 3 Lions (Center, Left, Right) -->
      <!-- Center Lion Face & Crown -->
      <path d="M -12,20 Q 0,10 12,20 Q 16,32 12,48 Q 0,55 -12,48 Q -16,32 -12,20 Z" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
      <!-- Lion Face Details in Gold -->
      <path d="M -8,25 Q 0,20 8,25 L 6,34 Q 0,38 -6,34 Z" fill="#FBBF24"/>
      <circle cx="-4" cy="27" r="1.5" fill="#000"/>
      <circle cx="4" cy="27" r="1.5" fill="#000"/>
      <path d="M -3,32 Q 0,35 3,32" fill="none" stroke="#000" stroke-width="1.5"/>
      
      <!-- Left Lion Profile -->
      <path d="M -12,25 C -22,20 -25,35 -20,48 C -16,52 -12,50 -12,45 Z" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.5"/>
      <!-- Right Lion Profile -->
      <path d="M 12,25 C 22,20 25,35 20,48 C 16,52 12,50 12,45 Z" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.5"/>
    </g>


    <!-- ==================== 2. GAJA-SIMHA / ELEPHANT-LION SUPPORTERS (LEFT & RIGHT) ==================== -->
    
    <!-- LEFT SUPPORTER (GAJA-SIMHA) -->
    <g id="left-supporter">
      <!-- Body & Legs -->
      <path d="M 175,270 C 140,260 130,220 150,170 C 165,140 195,130 215,145 C 210,170 195,190 205,220 C 215,250 200,270 175,270 Z" fill="url(#goldBody)" stroke="#B45309" stroke-width="2"/>
      <!-- Trunk & Tusks -->
      <path d="M 170,165 Q 160,135 185,120 Q 200,110 210,130 C 205,140 195,140 190,148 Z" fill="url(#goldBody)" stroke="#B45309" stroke-width="1.5"/>
      <path d="M 205,132 Q 220,128 225,138" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <!-- Red Mane -->
      <path d="M 170,170 C 150,180 145,210 165,240 C 175,220 185,200 180,180 Z" fill="url(#kspRed)" stroke="#7F1D1D" stroke-width="1.5"/>
      <!-- Tail -->
      <path d="M 140,220 Q 115,225 125,255 Q 135,275 145,260" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
      <path d="M 145,260 Q 155,270 148,280 Q 138,275 145,260 Z" fill="url(#goldMane)"/>
    </g>

    <!-- RIGHT SUPPORTER (GAJA-SIMHA) -->
    <g id="right-supporter" transform="translate(500,0) scale(-1,1)">
      <!-- Body & Legs -->
      <path d="M 175,270 C 140,260 130,220 150,170 C 165,140 195,130 215,145 C 210,170 195,190 205,220 C 215,250 200,270 175,270 Z" fill="url(#goldBody)" stroke="#B45309" stroke-width="2"/>
      <!-- Trunk & Tusks -->
      <path d="M 170,165 Q 160,135 185,120 Q 200,110 210,130 C 205,140 195,140 190,148 Z" fill="url(#goldBody)" stroke="#B45309" stroke-width="1.5"/>
      <path d="M 205,132 Q 220,128 225,138" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <!-- Red Mane -->
      <path d="M 170,170 C 150,180 145,210 165,240 C 175,220 185,200 180,180 Z" fill="url(#kspRed)" stroke="#7F1D1D" stroke-width="1.5"/>
      <!-- Tail -->
      <path d="M 140,220 Q 115,225 125,255 Q 135,275 145,260" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
      <path d="M 145,260 Q 155,270 148,280 Q 138,275 145,260 Z" fill="url(#goldMane)"/>
    </g>


    <!-- ==================== 3. CENTRAL SHIELD & GANDABERUNDA BIRD ==================== -->
    <g id="central-shield" transform="translate(250, 205)">
      <!-- Outer Navy Blue Shield Border -->
      <path d="M 0,-65 C 35,-65 55,-50 55,-20 C 55,30 30,55 0,72 C -30,55 -55,30 -55,-20 C -55,-50 -35,-65 0,-65 Z" fill="url(#kspNavy)" stroke="#FBBF24" stroke-width="3.5"/>

      <!-- Inner Bright Red Shield Body -->
      <path d="M 0,-56 C 28,-56 44,-42 44,-16 C 44,24 24,45 0,60 C -24,45 -44,24 -44,-16 C -44,-42 -28,-56 0,-56 Z" fill="url(#kspRed)" stroke="#F59E0B" stroke-width="2"/>

      <!-- GANDABERUNDA (OFFICIAL DOUBLE-HEADED MYTHICAL BIRD IN PURE WHITE) -->
      <g id="gandaberunda" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1">
        <!-- Center Body & Wings -->
        <path d="M 0,-15 C -15,-30 -32,-15 -28,8 C -22,25 -10,32 0,38 C 10,32 22,25 28,8 C 32,-15 15,-30 0,-15 Z"/>
        
        <!-- Left Head & Beak -->
        <path d="M -6,-24 C -10,-35 -22,-32 -20,-22 C -18,-15 -10,-15 -6,-24 Z"/>
        <path d="M -18,-28 L -26,-24 L -18,-21 Z" fill="#FCD34D"/>
        
        <!-- Right Head & Beak -->
        <path d="M 6,-24 C 10,-35 22,-32 20,-22 C 18,-15 10,-15 6,-24 Z"/>
        <path d="M 18,-28 L 26,-24 L 18,-21 Z" fill="#FCD34D"/>
        
        <!-- Tail Feathers -->
        <path d="M -14,24 L -20,40 L -8,36 L 0,42 L 8,36 L 20,40 L 14,24 Z" fill="#FFFFFF"/>
        
        <!-- Crown / Kalasa on Top of Heads -->
        <path d="M -3,-34 L 0,-42 L 3,-34 Z" fill="#FCD34D"/>
      </g>
    </g>


    <!-- ==================== 4. BASE GREEN SCROLL & SATYAMEVA JAYATE RIBBON ==================== -->
    <g id="base-scroll" transform="translate(250, 310)">
      <!-- Green Acanthus Leaf Ornaments -->
      <path d="M -110,-20 Q -70,25 0,15 Q 70,25 110,-20 Q 80,35 0,28 Q -80,35 -110,-20 Z" fill="url(#kspGreen)" stroke="#064E3B" stroke-width="2"/>
      <path d="M -125,-10 C -90,40 -20,35 0,20 C 20,35 90,40 125,-10 C 95,15 50,22 0,10 C -50,22 -95,15 -125,-10 Z" fill="url(#kspGreen)" stroke="#047857" stroke-width="1.5"/>

      <!-- Golden Banner Ribbon -->
      <path d="M -75,10 Q 0,25 75,10 Q 65,30 0,35 Q -65,30 -75,10 Z" fill="url(#goldBody)" stroke="#B45309" stroke-width="2"/>
      <path d="M -75,10 L -90,22 L -70,26 Z" fill="#D97706"/>
      <path d="M 75,10 L 90,22 L 70,26 Z" fill="#D97706"/>

      <!-- Devanagari Script Text: सत्यमेव जयते -->
      <text x="0" y="27" font-family="'Noto Sans Devanagari', 'Tiro Devanagari Hindi', sans-serif" font-weight="900" font-size="14" fill="#78350F" text-anchor="middle" letter-spacing="1">
        ಸತ್ಯಮೇವೇ ಜಯತೇ • सत्यमेव जयते
      </text>
    </g>


    <!-- ==================== 5. OFFICIAL TEXT AT BOTTOM ==================== -->
    <text x="250" y="380" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="22" fill="#0B1E36" text-anchor="middle" letter-spacing="1">
      Karnataka State Police
    </text>

  </g>
</svg>
